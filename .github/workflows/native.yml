# CI app native (NA-01, ADR TeachHub-ADR-Native-Mobile.md). Chạy khi PR đổi native/ hoặc file token.
name: native

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'native/**'
      - 'app/assets/tokens/teachhub.tokens.json'
      - '.github/workflows/native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tokens:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Token sinh khớp teachhub.tokens.json
        run: python3 native/tool/gen_tokens.py --check

  android:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Lint, unit test, build APK development
        run: ./gradlew lint testDevelopmentDebugUnitTest assembleDevelopmentDebug --console=plain

  ios:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test trên simulator, build Release
        run: |
          set -euo pipefail
          xcodebuild -version
          # Lấy simulator iPhone đầu tiên có sẵn trên runner (tên đổi theo bản Xcode của runner).
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          echo "Simulator: $sim"
          xcodebuild test -project DayHoc.xcodeproj -scheme DayHoc -destination "platform=iOS Simulator,name=$sim" -quiet
          xcodebuild build -project DayHoc.xcodeproj -scheme DayHoc -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
