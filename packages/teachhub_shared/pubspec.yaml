name: teachhub_shared
description: TeachHub — hợp đồng dùng chung giữa host shell và các mini-app (DiKey, route, membership).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Phosphor Regular (MIT — assets/fonts/phosphor/LICENSE), dùng qua TeachHubIcons.
  fonts:
    - family: Phosphor
      fonts:
        - asset: assets/fonts/phosphor/Phosphor.ttf
