# Sized for a CI container, not a workstation. The JVM grows to whatever -Xmx
# allows and the kernel kills it at the cgroup limit, so an 8G heap plus a 4G
# metaspace — a ~12.5G ceiling before the Kotlin daemon — is not "generous", it
# is an OOM (exit 137) on every runner. Too small fails as well: at -Xmx512m
# APK packaging ran out of heap, because zipflinger reads each entry, an engine
# .so included, into one byte[] (CI job 23572, 2026-10-07).
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
