name: app
description: TeachHub — host shell (super app giáo viên, phụ huynh, học sinh).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  # TeachHub
  teachhub_shared:
    path: ../packages/teachhub_shared
  teacher:
    path: ../mini_apps/teacher
  parent:
    path: ../mini_apps/parent
  student:
    path: ../mini_apps/student

  # Đăng nhập native (spec §2.2)
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  crypto: ^3.0.6
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # Network
  dio: ^5.7.0
  flutter_secure_storage: ^10.3.1

  # Routing
  go_router: ^14.8.1
  app_links: ^6.4.0

  # Firebase
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.5
  firebase_remote_config: ^6.5.3

  # Env & Storage
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3

  # Phiên bản cho header x-client-info. ^8 vì alice 1.0.0 chặn ở đó.
  package_info_plus: ^8.3.1

  # Internal packages
  flutter_svg: ^2.0.10
  tasco_ui_kit:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_utils:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_core:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_module:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_notifications:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_observability:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_storage:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  tasco_auth:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  # Shorebird-backed OTA updater (host-only; ADR-0017). Plugin footprint stays
  # in this package, never reaching mini-apps.
  tasco_ota:
    hosted: https://pub.vtii.vn
    version: ^5.2.7
  alice: ^1.0.0
  flutter_screenutil_plus: ^1.4.0
  flutter_easyloading_plus: ^3.2.0
  alice_dio: ^1.0.7
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^19.5.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  # Mỗi flavor chỉ đóng gói .env của chính nó: bản production không chứa URL
  # dev/staging. Build/run luôn kèm --flavor (docs/native-setup.md).
  assets:
    - path: assets/.env.development
      flavors: [development]
    - path: assets/.env.staging
      flavors: [staging]
    - path: assets/.env.production
      flavors: [production]

    # Bundled so the Shorebird engine can read the app id (ADR-0017 / P1-6).
    - shorebird.yaml

    # Token TeachHub ghi đè preset Tasco (lib/core/theme/teachhub_theme.dart).
    - assets/tokens/teachhub.tokens.json

    # Hình minh họa T01 lấy nguyên từ Figma (88:11172).
    - assets/images/login/

  # Inter 4.1 (rsms/inter, SIL OFL 1.1 — assets/fonts/inter/OFL.txt), font của Figma DS.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700

# Bản SQLite có mã hóa (SQLite3MultipleCiphers) cho CSDL ngoại tuyến của
# mini-app teacher — docs/adr/0001-encrypted-local-database.md.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
